<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI PC Quest · Intel Core Ultra</title>
<style>
:root{--bg:#050b16;--card:rgba(16,30,52,.72);--tx:#eaf4ff;--mu:#93acc8;--ac:#00c7fd;--ac2:#0068ff;--ok:#2ee59d;--no:#ff4d6d;--bd:rgba(120,180,255,.22);--gl:0 0 24px rgba(0,199,253,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eaf3ff;--card:rgba(255,255,255,.8);--tx:#0a1a30;--mu:#4a6382;--ac:#0068b5;--ac2:#00a6e8;--bd:rgba(0,80,160,.2);--gl:0 6px 24px rgba(0,104,181,.2)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:14px 14px 40px}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin-bottom:8px}
.hud b{color:var(--ac);font-size:16px}.xp{height:5px;border-radius:9px;background:var(--bd);overflow:hidden;margin-bottom:12px}.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));box-shadow:var(--gl);transition:width .6s}

.fb{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px;line-height:1.4;animation:in .3s}.y{background:rgba(46,229,157,.15);border:1px solid var(--ok)}.n{background:rgba(255,77,109,.15);border:1px solid var(--no)}

.pk{position:absolute;padding:9px 12px;border-radius:12px;background:var(--card);border:1px solid var(--no);font-size:14px;font-weight:800;white-space:nowrap;cursor:pointer;box-shadow:0 0 14px rgba(255,77,109,.4)}
.cl{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:12px;font-weight:800;color:var(--no);letter-spacing:.1em}
.spark{position:absolute;pointer-events:none;font-size:20px;animation:sp .7s forwards}@keyframes sp{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
.bat{height:36px;border-radius:10px;border:2px solid var(--bd);overflow:hidden;margin:6px 0 4px;position:relative}.bat i{display:block;height:100%;transition:width .8s cubic-bezier(.2,.8,.2,1)}.bat span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;text-shadow:0 1px 4px #000a;color:#fff}
.tg{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--bd);border-radius:14px;margin-top:8px;cursor:pointer;font-weight:700}.tg.on{border-color:var(--ac);box-shadow:var(--gl)}
.sw{width:44px;height:24px;border-radius:99px;background:var(--bd);position:relative;transition:.2s}.sw:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.on .sw{background:var(--ac)}.on .sw:after{left:23px}
.lap{text-align:center;padding:14px 6px;font-size:13px;line-height:1.35}.lap .em{font-size:44px;display:block}.lap.sc{border-color:var(--ac);box-shadow:var(--gl)}
.rv{display:none;margin-top:8px;text-align:left;font-size:12px;color:var(--tx)}.rv div{padding:2px 0}.lap.sc .rv{display:block}
.big{font-size:64px;font-weight:900;line-height:1}
table{width:100%;border-collapse:collapse;font-size:12.5px}td,th{border-bottom:1px solid var(--bd);padding:8px 5px;text-align:left;vertical-align:top}th:nth-child(2),td:nth-child(2){color:var(--ac);font-weight:800}
small{display:block;color:var(--mu);font-size:11.5px;line-height:1.4;margin-top:8px}li{margin:6px 0;color:var(--mu)}li b{color:var(--tx)}
#chip{display:block;margin:6px auto;width:230px;max-width:70%;filter:drop-shadow(0 0 22px rgba(0,199,253,.55));animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
</style><style>button,.pk,.lap{touch-action:manipulation;-webkit-tap-highlight-color:transparent}</style></head><body><canvas id="bg"></canvas><button id="lg" onclick="setLg()" aria-label="Language" style="position:fixed;top:8px;right:8px;z-index:20;padding:6px 12px;font-size:12px;border-radius:8px;width:auto">हिंग्लिश</button><div id="app"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app');
const S={p:null,pts:0,step:0,r:{e:0,p:0,b:0,s:0}};
let AC;const beep=(f,d=.09,t='sine')=>{try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}};
const good=()=>{beep(660,.08);setTimeout(()=>beep(990,.12),80);navigator.vibrate&&navigator.vibrate(15)},bad=()=>{beep(150,.25,'sawtooth');navigator.vibrate&&navigator.vibrate(60)};
/* animated background */
const cv=$('#bg'),cx=cv.getContext('2d');let N=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight;N=Array.from({length:Math.min(55,innerWidth/14|0)},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5}))}
rs();addEventListener('resize',rs);
(function dr(){cx.clearRect(0,0,cv.width,cv.height);cx.fillStyle='rgba(0,199,253,.7)';N.forEach((a,i)=>{a.x=(a.x+a.vx+cv.width)%cv.width;a.y=(a.y+a.vy+cv.height)%cv.height;cx.fillRect(a.x,a.y,2,2);for(let j=i+1;j<N.length;j++){const b=N[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<110){cx.strokeStyle=`rgba(0,160,255,${.22*(1-d/110)})`;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}}});requestAnimationFrame(dr)})();
function confetti(){for(let i=0;i<40;i++){const e=document.createElement('div');e.className='spark';e.textContent=['⚡','✨','🔷','💎'][i%4];e.style.cssText=`position:fixed;left:50%;top:40%;z-index:9;--x:${(Math.random()-.5)*600}px;--y:${(Math.random()-.2)*600}px`;document.body.appendChild(e);setTimeout(()=>e.remove(),800)}}
const P={
 student:{e:'🎓',n:'Student',rec:'Intel Core Ultra 5 · 16GB RAM · 512GB SSD · Evo thin-and-light',why:'Live captions, summaries and study tools run on the NPU, so the battery lasts through back-to-back lectures.'},
 creator:{e:'🎨',n:'Creator',rec:'Intel Core Ultra 7 · 16–32GB RAM · 1TB SSD · Intel Arc graphics',why:'The GPU and NPU share the AI load so edits, effects and exports stay fast, and your work stays on your device.'},
 gamer:{e:'🎮',n:'Gamer',rec:'Intel Core Ultra 7/9 · 16GB+ RAM · 1TB SSD · Arc or discrete GPU',why:'x86 runs your whole library natively. XeSS upscaling adds frames, and the NPU handles background AI so the GPU stays free for the game.'},
 pro:{e:'💼',n:'Professional',rec:'Intel Core Ultra 7 · 16GB RAM · 512GB SSD · Intel Evo / vPro',why:'Background blur, noise removal and AI assistants run on the NPU: private, quiet and battery-friendly.'}
};
function hud(){return `<div class="hud"><span>Level ${Math.min(Math.max(S.step-1,0),4)}/4</span><b id="pts">⚡ ${S.pts}</b></div><div class="xp"><i style="width:${S.step/6*100}%"></i></div>`}

const CHIP=`<svg id="chip" viewBox="0 0 200 200"><defs><linearGradient id="cg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#00c7fd"/><stop offset="1" stop-color="#0068ff"/></linearGradient></defs>${[...Array(6)].map((_,i)=>`<rect x="${40+i*24}" y="6" width="8" height="22" fill="#00c7fd"/><rect x="${40+i*24}" y="172" width="8" height="22" fill="#00c7fd"/><rect x="6" y="${40+i*24}" width="22" height="8" fill="#00c7fd"/><rect x="172" y="${40+i*24}" width="22" height="8" fill="#00c7fd"/>`).join('')}<rect x="28" y="28" width="144" height="144" rx="18" fill="#071426" stroke="url(#cg)" stroke-width="4"/><rect x="42" y="42" width="52" height="52" rx="8" fill="#ffb020" opacity=".9"/><rect x="106" y="42" width="52" height="52" rx="8" fill="#b266ff" opacity=".9"/><rect x="42" y="106" width="116" height="52" rx="8" fill="url(#cg)"><animate attributeName="opacity" values=".6;1;.6" dur="1.6s" repeatCount="indefinite"/></rect><g font-family="system-ui" font-weight="800" font-size="14" fill="#fff" text-anchor="middle"><text x="68" y="73">CPU</text><text x="132" y="73">GPU</text><text x="100" y="137">NPU · AI</text></g></svg>`;
function boot(){S.quick=0;A.innerHTML=`<div class="card" style="text-align:center;padding-top:26px"><span class="tag">INTEL CORE ULTRA · AI PC</span>${CHIP}<h1>Beat the <span class="g">store tricks.</span></h1><div id="tz" style="font-weight:700;margin:6px 0;min-height:26px;color:var(--ac)">😍 Looks amazing in the store…</div><p>4 arcade levels · 2 minutes · find the PC that still feels fast in 4 years.</p><button class="pri" onclick="beep(520);go(1)">▶ BOOT UP</button><button style="margin-top:8px;width:100%" onclick="beep(520);S.quick=1;go(1)">⚡ 30-second quick mode</button><small>🔊 Sound on for the full experience</small></div>`;tz()}
let tzi;function tz(){clearInterval(tzi);const L=['😍 Looks amazing in the store…','😵 Lags after one year…','⚡ Or stays fast for 4. Which will you pick?'];let i=0;tzi=setInterval(()=>{const e=$('#tz');if(!e)return clearInterval(tzi);i=(i+1)%L.length;e.textContent=L[i]},1700)}
function pick(){A.innerHTML=hud()+`<div class="card"><h2>Choose your player</h2><p>We’ll build your recommendation around this.</p><div class="row c2">${Object.entries(P).map(([k,v])=>`<button onclick="S.p='${k}';beep(700);go(S.quick?5:2)"><span style="font-size:34px;display:block">${v.e}</span>${v.n}</button>`).join('')}</div></div>`}
/* L1 ENGINE RUSH */
const T=[['🎥 Blur your call background all day','NPU','Steady, always-on AI is exactly what the NPU is built for, at very low power.'],['🎮 Run a game at high settings','GPU','Games need the GPU’s parallel power (Intel Arc).'],['📊 Open a huge spreadsheet','CPU','Everyday general-purpose work belongs on the CPU.'],['📝 Live captions in a lecture','NPU','Always-on captioning on the NPU saves battery and keeps CPU/GPU free.'],['🖼 Render a 4K video export','GPU','Heavy parallel media work is a GPU job.'],['🎙 Remove mic noise on a long call','NPU','Continuous audio AI runs efficiently on the NPU.'],['🌐 Live-translate a conversation','NPU','Sustained language AI is NPU territory.'],['⚙️ Compile code / run formulas','CPU','Sequential logic is the CPU’s strength.']];
let ti,cb,hit,tmo,lock;
function l1(){A.innerHTML=hud()+`<div class="card" style="text-align:center"><span class="tag">QUICK PRIMER</span><h2>Your PC has 3 brains</h2><div class="row c3"><div class="card" style="margin:0"><span style="font-size:30px">🧠</span><br><b>CPU</b><br><small>Everyday work: apps, sheets, code</small></div><div class="card" style="margin:0"><span style="font-size:30px">🎨</span><br><b>GPU</b><br><small>Graphics: games, video, 3D</small></div><div class="card" style="margin:0"><span style="font-size:30px">⚡</span><br><b>NPU</b><br><small>Always-on AI at very low power</small></div></div><p>Send each task to the right brain before time runs out.</p><button class="pri" onclick="beep(600);l1b()">Got it, go! →</button></div>`}
function l1b(){ti=0;cb=0;hit=0;T.sort(()=>Math.random()-.5);nx()}
function nx(){if(ti>=T.length){S.r.e=Math.round(hit/T.length*100);return interlude('Engine IQ '+S.r.e+'%','Intel Core Ultra gives you all three engines, so each task runs where it’s most efficient.',3)}
lock=0;A.innerHTML=hud()+`<div class="card" id="c1"><span class="tag">LEVEL 1 · ENGINE RUSH</span><h2>Route the task before it lands!</h2><p>Task ${ti+1}/${T.length} · 🔥 combo x${cb}</p><div class="zone"><div class="fc">${T[ti][0]}</div></div><div class="tb"><i></i></div><div class="row c3">${[['CPU','general'],['GPU','graphics'],['NPU','AI · low power']].map(e=>`<button class="eng ${e[0]}" onclick="a1('${e[0]}')">${e[0]}<small>${e[1]}</small></button>`).join('')}</div><div id="f"></div></div>`;
tmo=setTimeout(()=>a1(null),3400)}
function a1(e){if(lock)return;lock=1;clearTimeout(tmo);const ok=e===T[ti][1];$('.fc').style.animationPlayState='paused';
if(ok){hit++;cb++;addPts(20+cb*5);good()}else{cb=0;bad();$('#c1').classList.add('shake')}
$('#f').innerHTML=`<div class="fb ${ok?'y':'n'}">${ok?'✅ Nice! ':e?'❌ It’s the '+T[ti][1]+'. ':'⏱ Too slow! It’s the '+T[ti][1]+'. '}${T[ti][2]}</div>`;setTimeout(()=>{ti++;nx()},1700)}
function interlude(t,m,n){confetti();good();A.innerHTML=hud()+`<div class="card" style="text-align:center"><span class="tag">LEVEL CLEARED</span><h2>${t}</h2><p>${m}</p><button class="pri" onclick="go(${n})">Next level →</button></div>`}
/* L2 PRIVACY */
let sh,lk,sp,tm;
function l2(){sh=lk=sp=0;A.innerHTML=hud()+`<div class="card"><span class="tag">LEVEL 2 · PRIVACY DEFENDER</span><h2>Keep your data on the device</h2><p>Tap every file before it escapes to the cloud. AI PCs run many AI tasks locally on the NPU.</p><div id="arena"><div class="cl">☁️ CLOUD ZONE <span id="lk"></span></div></div></div>`;
const it=['📸 Photos','🎙 Voice notes','📄 Resume','💳 Bank PDF','🧾 Marksheet','💬 Chats','🎬 Raw video','🔑 Passwords','🏥 Health report'];
tm=setInterval(()=>{if(sp>=it.length){clearInterval(tm);return setTimeout(()=>{S.r.p=Math.round(sh/it.length*100);interlude(sh+'/'+it.length+' files protected',lk?lk+' leaked to the cloud. On an AI PC, tasks like captions, photo search and noise removal can run on-device, even offline.':'Perfect shield! Your data never left the device.',4)},3700)}
const d=document.createElement('div');d.className='pk';d.textContent=it[sp++];d.style.left=Math.random()*55+4+'%';d.style.top='-44px';d.style.transition='top '+(3.8-sp*.18)+'s linear';
d.onpointerdown=ev=>{if(d.dead)return;d.dead=1;sh++;addPts(15);good();const r=$('#arena').getBoundingClientRect();for(let k=0;k<6;k++){const s=document.createElement('div');s.className='spark';s.textContent='🔒';s.style.cssText=`left:${ev.clientX-r.left}px;top:${ev.clientY-r.top}px;--x:${(Math.random()-.5)*120}px;--y:${(Math.random()-.5)*120}px`;$('#arena').appendChild(s);setTimeout(()=>s.remove(),700)}d.remove()};
$('#arena').appendChild(d);requestAnimationFrame(()=>requestAnimationFrame(()=>d.style.top='305px'));
setTimeout(()=>{if(!d.dead){d.dead=1;lk++;bad();d.textContent='☁️ LEAKED';d.style.opacity=.45;$('#lk').textContent='· leaked '+lk}},(3.8-sp*.18)*1000+60)},950)}
/* L3 BATTERY LAB */
const F=[['📝 Live captions',0],['🎥 Background blur',0],['🎙 Noise removal',0]];let on=[0,0,0];
function l3(){on=[0,0,0];A.innerHTML=hud()+`<div class="card"><span class="tag">LEVEL 3 · BATTERY LAB</span><h2>Turn on your AI features</h2><p>Switch on all three and watch what happens to each laptop’s battery.</p>${F.map((f,i)=>`<div class="tg" id="t${i}" onclick="tgl(${i})"><span>${f[0]}</span><div class="sw"></div></div>`).join('')}<b style="display:block;margin-top:14px">Older laptop (AI on CPU)</b><div class="bat"><i id="b1"></i><span id="h1"></span></div><b>Intel Core Ultra AI PC (AI on NPU)</b><div class="bat"><i id="b2"></i><span id="h2"></span></div><div id="f"></div><button class="pri" id="nb" onclick="b3()" disabled>Lock in →</button><small>Illustrative model, not a benchmark. Real battery life varies by model, display and workload. Intel cites up to 20 hours of battery life in productivity use on Core Ultra 200V series; results vary by model.</small></div>`;upd()}
function tgl(i){on[i]^=1;beep(on[i]?800:400,.06);$('#t'+i).classList.toggle('on',on[i]);upd()}
function upd(){const n=on.reduce((a,b)=>a+b,0),o=9-n*1.2,a=15-n*0.3;$('#b1').style.width=o/15*100+'%';$('#b1').style.background='var(--no)';$('#b2').style.width=a/15*100+'%';$('#b2').style.background='var(--ok)';$('#h1').textContent=o.toFixed(1)+' h';$('#h2').textContent=a.toFixed(1)+' h';$('#nb').disabled=n<3;
$('#f').innerHTML=n==3?`<div class="fb y">With all AI features on, the older laptop loses <b>${(n*1.2/9*100)|0}%</b> of its battery. The AI PC loses only <b>${(n*.3/15*100)|0}%</b>, because the NPU runs steady AI work at a fraction of the power.</div>`:''}
function b3(){S.r.b=100;addPts(60);interlude('Battery Lab complete','The NPU is why AI features can stay on all day without killing your battery.',5)}
/* L4 STORE TRAP */
const L=[['🌸','BlushBook','Pastel pink · “Lowest price!”',['8GB RAM (slow with many tabs)','Older chip · no NPU','No AI features','~4h real battery'],0],['🔷','Silverline','Slim silver · “Intel Evo”',['16GB RAM','Intel Core Ultra (200V / Series 3) · NPU 40+ TOPS','AI features on-device','All-day battery'],1],['🌈','RGB Beast','Rainbow lights · “Gamer edition”',['8GB RAM','Older chip · no NPU','Loud fans, heavy','~3h real battery'],0]];
let scn;
function l4(){scn=[0,0,0];L.sort(()=>Math.random()-.5);A.innerHTML=hud()+`<div class="card"><span class="tag">LEVEL 4 · STORE TRAP</span><h2>Scan all 3, then pick one</h2><p>Don’t trust the colour. Tap each laptop to scan its real specs.</p><div class="row c3">${L.map((l,i)=>`<div class="card lap" id="L${i}" onclick="scan(${i})" style="margin:0;cursor:pointer"><span class="em">${l[0]}</span><b>${l[1]}</b><br>${l[2]}<div class="rv">${l[3].map(x=>`<div>▪ ${x}</div>`).join('')}</div></div>`).join('')}</div><div class="row c3" id="by" style="display:none">${L.map((l,i)=>`<button onclick="buy(${i})">Buy</button>`).join('')}</div><div id="f"></div></div>`}
function scan(i){scn[i]=1;beep(900,.1);$('#L'+i).classList.add('sc');if(scn.every(x=>x))$('#by').style.display='grid'}
function buy(i){const ok=L[i][4];S.r.s=ok?100:25;addPts(ok?80:10);ok?good():bad();document.querySelectorAll('#by button').forEach(b=>b.disabled=1);$('#f').innerHTML=`<div class="fb ${ok?'y':'n'}">${ok?'✅ Smart buy! The shell didn’t fool you. NPU, enough RAM and a verified-quality design keep it smooth for years.':'❌ Looks fun, but without an NPU and with 8GB RAM it will struggle with AI features and slow down within a year or two.'}</div><button class="pri" onclick="pri()">See my AI PC match 🎯</button>`}
